short_description: "Analyze a math problem image and generate validated GeoGebra commands for geometric visualization."
when_to_use: "Use when the user uploads a geometry/math diagram and wants to visualize it in GeoGebra; **also proactively call when explaining geometry concepts** (e.g. Pythagorean theorem, triangles, function graphs) — just pass the concept description as `question`."
input_format: "The math problem text (question). If an image attachment exists it will be auto-injected for richer analysis, but it is NOT required."
guideline: "Invoke this tool whenever the problem involves geometry OR when you are explaining a visualizable concept. The tool runs a full 4-stage pipeline (detection → analysis → scripting → reflection) and returns ready-to-render GeoGebra commands. **Even without an image, passing only question text can generate basic geometric figures** (right triangles, coordinate axes, function curves, etc.). When the tool result contains a ```ggbscript[…]``` fenced block, copy that entire block verbatim into your final answer so the chat surface can render the interactive figure."
note: "The pipeline requires a vision-capable LLM. Processing may take 15-30 seconds due to four sequential LLM calls. Without an image the output is a basic schematic; with an image it precisely reconstructs the original figure."
phase: "exploration"
