short_description: "分析数学题目图片，生成经过验证的 GeoGebra 命令用于几何可视化。"
when_to_use: "当用户上传了几何或数学配图并希望在 GeoGebra 中重建/可视化时使用；**也可以在讲解几何概念（如勾股定理、三角形、函数图像）时主动调用**，传入 question 文本描述要画的图形即可。"
input_format: "数学题目文本（question）。如有图片附件会自动注入增强分析效果，但非必须。"
guideline: "当题目涉及几何图形或你在讲解一个几何/可可视化概念时调用此工具。工具内部运行完整的 4 阶段流水线（检测→分析→脚本生成→反思验证），返回可直接渲染的 GeoGebra 命令。**即使没有图片附件，仅凭 question 文本也能生成基础几何图形**（如直角三角形、坐标系、函数曲线）。当工具返回的结果中包含 ```ggbscript[…]``` 围栏代码块时，必须在最终回答中原样复制该完整代码块，前端才能据此渲染可交互的几何图形。"
note: "流水线需要支持视觉的 LLM。由于包含四次连续 LLM 调用，处理时间约 15-30 秒。无图片时生成的图形为基础示意，有图片时会精确还原。"
phase: "exploration"
